<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>알스터 수강생 자료실</title>
<meta name="description" content="알스터 강의 수강생 전용 자료 다운로드">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="알스터 수강생 자료실">
<meta property="og:description" content="수강생 전용 자료집을 받아가세요">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0c2e1b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@600;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root {
    --bg: #eef2ee; --surface: #ffffff; --surface-2: #f5f8f5;
    --ink: #13201a; --ink-2: #4c5a52; --ink-3: #87938c; --line: #dde4de;
    --forest: #0c2e1b; --forest-2: #164a2e; --leaf: #22c46e; --leaf-ink: #0d7a43; --leaf-soft: #e3f6eb;
    --danger: #d23a2e; --on-forest: #eaf3ec; --on-forest-2: #a9c3b2;
    --shadow: 0 1px 2px rgba(12,46,27,.06), 0 8px 24px -12px rgba(12,46,27,.18);
    --display: "Hahmlet", "IBM Plex Sans KR", serif;
    --body: "IBM Plex Sans KR", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0a120d; --surface: #121c16; --surface-2: #17241c; --ink: #e6efe8; --ink-2: #a6b5ab; --ink-3: #6f8077;
      --line: #23332a; --forest: #08200f; --forest-2: #123b24; --leaf: #2fd47c; --leaf-ink: #49e08f; --leaf-soft: #163a25;
      --danger: #ff6b5e; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0a120d; --surface: #121c16; --surface-2: #17241c; --ink: #e6efe8; --ink-2: #a6b5ab; --ink-3: #6f8077;
    --line: #23332a; --forest: #08200f; --forest-2: #123b24; --leaf: #2fd47c; --leaf-ink: #49e08f; --leaf-soft: #163a25;
    --danger: #ff6b5e; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
    color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; min-height: 100vh; }
  a { color: inherit; text-decoration: none; }
  button, input { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--leaf); outline-offset: 3px; border-radius: 8px; }
  svg { display: block; }
  [hidden] { display: none !important; }

  .wrap { max-width: 520px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  /* 히어로 */
  .hero { background: var(--forest); color: var(--on-forest); padding: calc(env(safe-area-inset-top, 0px) + 20px) 0 84px; position: relative; overflow: hidden; }
  .hero::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .55;
    background: radial-gradient(60% 55% at 100% 0%, rgba(34,196,110,.28), transparent 70%), radial-gradient(50% 50% at 0% 100%, rgba(34,196,110,.12), transparent 70%); }
  .hero .wrap { position: relative; z-index: 1; }
  .top { display: flex; align-items: center; justify-content: space-between; height: 38px; }
  .wordmark { font-family: var(--mono); font-size: 13px; letter-spacing: .08em; display: flex; align-items: center; gap: 8px; }
  .wordmark i { width: 7px; height: 7px; border-radius: 50%; background: var(--leaf); box-shadow: 0 0 0 3px rgba(34,196,110,.25); }
  .lock-btn { font-size: 13px; font-weight: 600; color: var(--on-forest-2); display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,.08); }
  .lock-btn:hover { background: rgba(255,255,255,.16); color: var(--on-forest); }
  .lock-btn svg { width: 14px; height: 14px; }
  .kicker { margin-top: 34px; display: inline-flex; font-size: 12px; font-weight: 700; color: var(--forest); background: var(--leaf); padding: 4px 10px; border-radius: 999px; }
  .hero h1 { font-family: var(--display); font-weight: 800; font-size: 36px; line-height: 1.15; letter-spacing: -.02em; margin-top: 12px; word-break: keep-all; }
  .hero h1 em { font-style: normal; color: var(--leaf); }
  .hero p { margin-top: 10px; color: var(--on-forest-2); font-size: 14.5px; word-break: keep-all; }

  main { margin-top: -56px; position: relative; z-index: 2; padding-bottom: 48px; }
  .card { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); }

  /* 비밀번호 */
  .gate { padding: 24px 20px 22px; }
  .gate h2 { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .gate h2 svg { width: 20px; height: 20px; color: var(--leaf-ink); }
  .gate .hint { font-size: 13.5px; color: var(--ink-2); margin-top: 4px; word-break: keep-all; }
  .field { margin-top: 16px; display: flex; gap: 8px; }
  .field input { flex: 1; min-width: 0; height: 52px; padding: 0 16px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface-2); font-size: 16px; }
  .field input:focus { outline: none; border-color: var(--leaf); background: var(--surface); }
  .field input[aria-invalid="true"] { border-color: var(--danger); }
  .go { height: 52px; padding: 0 20px; border-radius: 14px; background: var(--forest); color: #fff; font-weight: 700; flex: none; display: inline-flex; align-items: center; gap: 6px; transition: opacity .15s; }
  :root[data-theme="dark"] .go { background: var(--leaf); color: #08200f; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .go { background: var(--leaf); color: #08200f; } }
  .go:disabled { opacity: .6; cursor: wait; }
  .go svg { width: 16px; height: 16px; }
  .remember { margin-top: 12px; display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ink-2); cursor: pointer; width: fit-content; }
  .remember input { width: 18px; height: 18px; accent-color: var(--leaf-ink); }
  .msg { margin-top: 10px; font-size: 13.5px; font-weight: 600; color: var(--danger); min-height: 1.4em; }
  .shake { animation: shake .35s; }
  @keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }

  /* 자료 목록 */
  .summary { padding: 16px 20px; display: flex; align-items: center; gap: 12px; }
  .summary .ok { width: 40px; height: 40px; border-radius: 12px; background: var(--leaf-soft); color: var(--leaf-ink); display: grid; place-items: center; flex: none; }
  .summary .ok svg { width: 20px; height: 20px; }
  .summary b { display: block; font-size: 15px; }
  .summary span { font-size: 13px; color: var(--ink-2); }
  .group { margin-top: 28px; }
  .group h3 { font-size: 13px; font-weight: 700; color: var(--ink-3); letter-spacing: .02em; padding: 0 4px 10px; display: flex; align-items: center; gap: 8px; }
  .group h3 small { font-family: var(--mono); font-weight: 500; }
  .list { overflow: hidden; }
  .item { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 14px; padding: 14px 16px; }
  .item + .item { border-top: 1px solid var(--line); }
  .ic { width: 44px; height: 44px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; font-family: var(--mono); font-size: 10.5px; font-weight: 500; color: var(--leaf-ink); }
  .item .t { font-weight: 700; font-size: 15px; line-height: 1.35; word-break: keep-all; }
  .item .new { display: inline-block; vertical-align: 2px; margin-left: 6px; font-size: 10px; font-weight: 700; color: #fff; background: var(--danger); padding: 1px 6px; border-radius: 6px; }
  .item .d { font-size: 13px; color: var(--ink-2); margin-top: 2px; word-break: keep-all; }
  .dl { height: 38px; padding: 0 14px; border-radius: 999px; background: var(--leaf-soft); color: var(--leaf-ink); font-weight: 700; font-size: 13.5px; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; transition: transform .15s; }
  a.dl:hover { transform: translateY(-1px); }
  .dl svg { width: 15px; height: 15px; }
  .dl.soon { background: transparent; color: var(--ink-3); border: 1px dashed var(--line); cursor: default; }

  .foot { margin-top: 32px; text-align: center; font-size: 12.5px; color: var(--ink-3); word-break: keep-all; }
  .foot a { text-decoration: underline; text-underline-offset: 3px; }

  @media (max-width: 380px) {
    .hero h1 { font-size: 30px; }
    .item { grid-template-columns: 40px minmax(0, 1fr); }
    .ic { width: 40px; height: 40px; }
    .dl { grid-column: 2; justify-self: start; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <div class="top">
      <div class="wordmark"><i></i>R.STER</div>
      <button class="lock-btn" id="lockBtn" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        잠그기
      </button>
    </div>
    <span class="kicker">수강생 전용</span>
    <h1>알스터 <em>자료실</em></h1>
    <p>강의에서 안내받은 비밀번호를 입력하면 자료집을 받을 수 있어요.</p>
  </div>
</header>

<main class="wrap">
  <form class="card gate" id="gate" autocomplete="off">
    <h2>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="m10.85 12.15 8.65-8.65M18 5l2 2M15 8l2 2"/></svg>
      비밀번호 입력
    </h2>
    <p class="hint">비밀번호를 모르시면 수강생 단톡방 공지를 확인해 주세요.</p>
    <div class="field">
      <input id="pw" type="password" inputmode="text" placeholder="비밀번호" aria-label="비밀번호" required>
      <button class="go" id="go" type="submit">
        열기
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
    <label class="remember"><input type="checkbox" id="remember" checked> 이 기기에서 기억하기</label>
    <p class="msg" id="msg" role="alert"></p>
  </form>

  <section id="lib" hidden>
    <div class="card summary">
      <div class="ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></svg></div>
      <div><b>환영해요, 수강생님!</b><span id="count"></span></div>
    </div>
    <div id="groups"></div>
  </section>

  <p class="foot">자료는 수강생 개인 학습용이에요. 외부 공유와 재배포는 삼가주세요.<br>문의 · <a href="https://open.kakao.com/o/ssFViPZg" target="_blank" rel="noopener">카카오톡 상담</a></p>
</main>

<script>
(function () {
  var KEY = "rster-materials-pw";
  var gate = document.getElementById("gate");
  var pw = document.getElementById("pw");
  var go = document.getElementById("go");
  var msg = document.getElementById("msg");
  var remember = document.getElementById("remember");
  var lib = document.getElementById("lib");
  var groupsEl = document.getElementById("groups");
  var lockBtn = document.getElementById("lockBtn");

  function store(fn) { try { return fn(localStorage); } catch (e) { return null; } }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

  var DL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>';

  function render(materials) {
    var total = 0;
    groupsEl.innerHTML = materials.map(function (g) {
      total += g.items.length;
      return '<div class="group"><h3>' + esc(g.category) + ' <small>' + g.items.length + '</small></h3><div class="card list">' +
        g.items.map(function (it) {
          var btn = it.url
            ? '<a class="dl" href="' + esc(it.url) + '" target="_blank" rel="noopener">' + DL + '받기</a>'
            : '<span class="dl soon">준비 중</span>';
          return '<div class="item"><div class="ic">' + esc(it.type || "FILE") + '</div><div>' +
            '<div class="t">' + esc(it.title) + (it.isNew ? '<span class="new">NEW</span>' : '') + '</div>' +
            (it.desc ? '<div class="d">' + esc(it.desc) + '</div>' : '') + '</div>' + btn + '</div>';
        }).join("") + '</div></div>';
    }).join("");
    document.getElementById("count").textContent = "자료 " + total + "개를 받을 수 있어요.";
    gate.hidden = true; lib.hidden = false; lockBtn.hidden = false;
  }

  function fail(text) {
    msg.textContent = text;
    pw.setAttribute("aria-invalid", "true");
    gate.classList.remove("shake"); void gate.offsetWidth; gate.classList.add("shake");
  }

  function unlock(password, silent) {
    go.disabled = true; msg.textContent = "";
    return fetch("/api/unlock", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: password }) })
      .then(function (r) { return r.json().then(function (j) { return { status: r.status, body: j }; }); })
      .then(function (res) {
        if (res.status === 200) {
          if (remember.checked) store(function (s) { s.setItem(KEY, password); });
          render(res.body.materials);
        } else {
          store(function (s) { s.removeItem(KEY); });
          if (!silent) fail(res.status === 401 ? "비밀번호가 맞지 않아요. 다시 확인해 주세요." : "잠시 후 다시 시도해 주세요.");
        }
      })
      .catch(function () { if (!silent) fail("연결이 불안정해요. 잠시 후 다시 시도해 주세요."); })
      .then(function () { go.disabled = false; });
  }

  gate.addEventListener("submit", function (e) {
    e.preventDefault();
    var v = pw.value.trim();
    if (v) unlock(v, false);
  });
  pw.addEventListener("input", function () { pw.removeAttribute("aria-invalid"); msg.textContent = ""; });

  lockBtn.addEventListener("click", function () {
    store(function (s) { s.removeItem(KEY); });
    groupsEl.innerHTML = ""; pw.value = "";
    lib.hidden = true; gate.hidden = false; lockBtn.hidden = true;
    pw.focus();
  });

  var saved = store(function (s) { return s.getItem(KEY); });
  if (saved) unlock(saved, true);
})();
</script>
</body>
</html>
