<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>알스터 링크 모음</title>
<meta name="description" content="알스터 블로그 소통방 · 자영업자 마케팅 소통방 · 블로그 교육 · 네이버 마케팅 대행 문의">
<meta name="robots" content="noindex">
<meta property="og:title" content="알스터 링크 모음">
<meta property="og:description" content="블로그 소통방 · 자영업자 마케팅 소통방 · 블로그 교육 · 마케팅 대행 문의">
<meta property="og:type" content="website">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --bg: #eef0f4;
    --card: #ffffff;
    --tile: #f6f7f9;
    --text: #1d1f23;
    --sub: #6b7078;
    --line: #e4e6ea;
    --green: #1f4d2b;
    --kakao: #fee500;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 440px; margin: 0 auto; padding: 40px 16px 48px; }

  .profile { text-align: center; margin-bottom: 24px; }
  .avatar {
    width: 88px; height: 88px; margin: 0 auto 14px; border-radius: 50%;
    background: var(--card); display: grid; place-items: center; font-size: 44px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
  }
  .profile h1 { font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
  .profile p { margin-top: 6px; font-size: 14px; color: var(--sub); line-height: 1.5; }

  .card {
    background: var(--card); border-radius: 20px; padding: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,.04);
  }
  .card + .card { margin-top: 14px; }
  .card h2 { font-size: 13px; font-weight: 700; color: var(--sub); margin: 2px 4px 12px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .item {
    display: flex; flex-direction: column; text-decoration: none; color: inherit;
    border-radius: 16px; transition: transform .15s ease;
  }
  .item:active { transform: scale(.97); }
  .thumb {
    aspect-ratio: 1 / 1; border-radius: 16px; background: var(--tile);
    display: grid; place-items: center; overflow: hidden; position: relative;
  }
  .thumb svg { width: 62%; height: auto; }
  .thumb .emoji { font-size: 56px; line-height: 1; }
  .badge {
    position: absolute; top: 10px; left: 10px; right: 10px;
    display: flex; align-items: center; justify-content: center; gap: 4px;
    font-size: 12px; font-weight: 500; white-space: nowrap;
  }
  .badge b { font-weight: 800; }
  .badge svg { width: 16px; height: 16px; flex: none; }
  .kakao .thumb { background: linear-gradient(180deg, #fffbe0 0%, var(--tile) 70%); }
  .label {
    margin-top: 10px; font-size: 13.5px; font-weight: 600; text-align: center;
    line-height: 1.35; letter-spacing: -.02em; word-break: keep-all;
  }
  @media (hover: hover) {
    .item:hover .thumb { box-shadow: inset 0 0 0 2px var(--line); }
  }

  footer { text-align: center; font-size: 12px; color: #9aa0a8; margin-top: 28px; }
</style>
</head>
<body>
<main>
  <header class="profile">
    <div class="avatar" aria-hidden="true">🐹</div>
    <h1>알스터</h1>
    <p>블로그 · 네이버 마케팅 이야기를 나눠요</p>
  </header>

  <section class="card">

      <a class="item kakao" href="https://open.kakao.com/o/gJSPPoHh" target="_blank" rel="noopener">
        <div class="thumb">

          <span class="emoji" aria-hidden="true">🐹</span>

      <a class="item kakao" href="https://open.kakao.com/o/gV2tV3Oh" target="_blank" rel="noopener">
        <div class="thumb">
          <span class="badge"><svg viewBox="0 0 24 24"><path fill="#1d1f23" d="M12 3C6.5 3 2 6.6 2 11c0 2.8 1.9 5.3 4.7 6.7l-1 3.6c-.1.3.3.6.6.4l4.2-2.8c.5.1 1 .1 1.5.1 5.5 0 10-3.6 10-8S17.5 3 12 3z"/></svg>카카오톡<b>오픈채팅</b></span>
          <span class="emoji" aria-hidden="true">🏪</span>
        </div>
        <span class="label">자영업자 마케팅 소통방</span>
      </a>
    </div>
  </section>

  <section class="card">
    <h2>1:1 문의</h2>
    <div class="grid">
      <a class="item" href="https://open.kakao.com/o/ssFViPZg" target="_blank" rel="noopener">
        <div class="thumb">

          <svg viewBox="0 0 100 100" fill="none" stroke="#1f4d2b" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

            <path d="M26 50v-8a8 8 0 0 1 16 0"/><path d="M40 38l22-12"/>

            <path d="M12 90v-4a10 10 0 0 1 20 0v4z"/><path d="M40 90v-4a10 10 0 0 1 20 0v4z"/><path d="M68 90v-4a10 10 0 0 1 20 0v4z"/>

          <svg viewBox="0 0 100 100" fill="none" stroke="#1f4d2b" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="50" cy="50" r="30" stroke-dasharray="4 7"/>
            <path d="M38 44h6l14-9v30l-14-9h-6z"/><path d="M44 56l3 9"/><path d="M63 45a7 7 0 0 1 0 10"/>
            <circle cx="22" cy="22" r="11" fill="#fff"/><path d="M17 23c3 2 8 1 10-4-2 1-3 0-3 0" stroke-width="3"/>
            <circle cx="78" cy="22" r="11" fill="#fff"/><path d="M80 16h-2a3 3 0 0 0-3 3v10M73 22h6" stroke-width="3"/>

  <footer>© 알스터</footer>
</main>
</body>
</html>
