    teach: svg('<rect x="3" y="3" width="18" height="12" rx="1.5"/><path d="M8 21l4-6 4 6M7 8h6M7 11h10"/>'),
    mega: svg('<path d="M3 10v4h4l7 5V5L7 10H3z"/><path d="M18 9a4 4 0 0 1 0 6"/>'),
    folder: svg('<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M8 13h8"/>'),
    book: svg('<path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H20v15H5.5A1.5 1.5 0 0 0 4 19.5z"/><path d="M4 19.5A1.5 1.5 0 0 0 5.5 21H20"/><path d="M9 8h7"/>'),
    gift: svg('<rect x="3" y="8" width="18" height="5" rx="1"/><path d="M5 13v8h14v-8M12 8v13M12 8S10.5 3 8 4.5 9.5 8 12 8zm0 0s1.5-5 4-3.5S14.5 8 12 8z"/>')
  };

  /* 히어로 */
  document.getElementById("hero").innerHTML =
    '<div class="wrap">' +
      '<div class="who">' +
        '<div class="photo">' + (S.photo ? '<img src="' + esc(S.photo) + '" alt="' + esc(S.name) + ' 프로필 사진">' : '<span>R</span>') + '</div>' +
        '<div><h1>' + esc(S.name) + '</h1><div class="handle">' + esc(S.handle) + '</div></div>' +
      '</div>' +
      '<p class="role">' + esc(S.role) + '</p>' +
      '<p class="bio">' + esc(S.bio) + '</p>' +
      '<div class="search" aria-label="알스터가 다루는 분야">' +
        '<span class="n" aria-hidden="true">R</span>' +
        '<span class="q"><span id="typed">' + esc(S.keywords[0]) + '</span><span class="caret" aria-hidden="true"></span></span>' +
        '<a class="go" href="#services" aria-label="서비스 보기">' + I.search + '</a>' +
      '</div>' +
      '<div class="contact">' +
        '<a class="chip" href="mailto:' + esc(S.email) + '?subject=' + encodeURIComponent("[협업 제안] ") + '">' + I.mail + '협업 제안</a>' +
        '<button class="chip mail" id="copyMail" aria-label="이메일 주소 복사">' + esc(S.email) + I.copy + '</button>' +
      '</div>' +
    '</div>';
  document.getElementById("barName").textContent = S.name;

  /* 본문 */
  var F = S.featured;
  var ticket =
    '<a class="card ticket"' + attrs(F.url) + '>' +
      '<div class="main"><span class="kicker">🔥 ' + esc(F.kicker) + '</span>' +
        '<h3>' + esc(F.title) + '</h3><p>' + esc(F.desc) + '</p>' +
        '<span class="cta">' + esc(F.cta) + I.arrow + '</span></div>' +
      '<div class="stub" aria-hidden="true"><b>FREE</b><small>무료 강의</small></div>' +
    '</a>';

  var row = function (it, ico, extra) {
    return '<a class="card row"' + attrs(it.url) + '>' +
      '<span class="ico' + (ico === "kakao" ? " kakao" : "") + '">' + I[ico] + '</span>' +
      '<span class="txt"><span class="t">' + esc(it.title) + '</span><span class="d">' + esc(it.desc) + '</span>' + (extra || "") + '</span>' +
      (it.free ? '<span class="free-badge">FREE</span>' : "") +
      (it.url ? '<span class="arrow">' + I.arrow + '</span>' : '<span class="soon">준비 중</span>') +
    '</a>';
  };

  /* 서비스: 개수가 홀수면 첫 카드를 넓게, 짝수면 앞의 두 카드를 넓게 → 2열 칸이 비지 않음 */
  var wideCount = S.services.length % 2 ? 1 : 2;
  var services = S.services.map(function (it, i) {
    var wide = i < wideCount;
    var label = it.url ? (it.url.indexOf("open.kakao") > -1 ? "카톡으로 문의" : "자세히 보기") : "곧 열려요";
    var foot = '<span class="foot' + (it.url ? "" : " off") + '">' + label + I.arrow + '</span>';
    var tags = it.tags ? '<div class="tags">' + it.tags.map(function (t) { return '<span>' + esc(t) + '</span>'; }).join("") + '</div>' : "";
    return '<a class="card svc' + (wide ? " wide" : "") + '"' + attrs(it.url) + '>' +
      (wide
        ? '<div class="head"><span class="ico">' + I[it.icon] + '</span><div><div class="t">' + esc(it.title) + '</div><div class="d">' + esc(it.desc) + '</div></div></div>' + tags
        : '<span class="ico">' + I[it.icon] + '</span><span class="t">' + esc(it.title) + '</span><span class="d">' + esc(it.desc) + '</span>') +
      foot + '</a>';
  }).join("");

  var lib = S.library.map(function (it) {
    var price = it.price ? '<span class="price">' + (it.discount ? '<em>' + esc(it.discount) + '</em>' : "") + '<b>' + esc(it.price) + '</b></span>' : "";
    return row(it, it.icon, price);
  }).join("");

  document.getElementById("content").innerHTML =
    '<section>' + ticket + '</section>' +
    '<section><div class="sec-h"><h2>소통방</h2><span>KakaoTalk</span></div><div class="stack">' +
      S.community.map(function (c) { return row(c, "kakao"); }).join("") + '</div></section>' +
    '<section id="services"><div class="sec-h"><h2>서비스</h2><span>Services</span></div><div class="grid">' + services + '</div></section>' +
    '<section><div class="sec-h"><h2>자료실</h2><span>Library</span></div><div class="stack">' + lib + '</div></section>' +
    '<footer><span>협업 문의 · <span class="mono">' + esc(S.email) + '</span></span><span>© ' + new Date().getFullYear() + ' ' + esc(S.name) + '</span></footer>';

  document.getElementById("dock").innerHTML =
    '<a' + attrs(F.url) + '><span class="dot" aria-hidden="true"></span>' + esc(F.kicker) + ' ' + esc(F.title) + ' 신청</a>';

  /* 안내 토스트 */
  var toastEl = document.getElementById("toast"), tid;
  var toast = function (msg) { toastEl.textContent = msg; toastEl.classList.add("show"); clearTimeout(tid); tid = setTimeout(function () { toastEl.classList.remove("show"); }, 1800); };
  document.addEventListener("click", function (e) {
    if (e.target.closest("[data-soon]")) { e.preventDefault(); toast("곧 열릴 예정이에요 🙌"); }
  });

  var copy = function (text, done) {
    try { navigator.clipboard.writeText(text).then(function () { toast(done); }, function () { toast(text); }); }
    catch (err) { toast(text); }
  };
  document.getElementById("copyMail").addEventListener("click", function () { copy(S.email, "이메일 주소를 복사했어요"); });
  document.getElementById("share").addEventListener("click", function () {
    var url = location.href;
    if (navigator.share) {
      navigator.share({ title: document.title, url: url }).catch(function (err) { if (!err || err.name !== "AbortError") copy(url, "링크를 복사했어요"); });
    } else copy(url, "링크를 복사했어요");
  });

  /* 검색창 타이핑 */
  var typed = document.getElementById("typed");
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!reduce && S.keywords.length > 1) {
    var k = 0, pos = S.keywords[0].length, deleting = true;
    var tick = function () {
      var word = S.keywords[k];
      if (deleting) {
        pos--; typed.textContent = word.slice(0, pos);
        if (pos <= 0) { deleting = false; k = (k + 1) % S.keywords.length; }
        setTimeout(tick, 45);
      } else {
        word = S.keywords[k]; pos++; typed.textContent = word.slice(0, pos);
        if (pos >= word.length) { deleting = true; setTimeout(tick, 1800); } else setTimeout(tick, 95);
      }
    };
    setTimeout(tick, 2200);
  }

  /* 스크롤: 상단 바에 이름 표시, 맨 아래에서는 CTA 숨김 */
  var bar = document.getElementById("bar"), dock = document.getElementById("dock");
  var onScroll = function () {
    bar.classList.toggle("scrolled", window.scrollY > 120);
    var nearEnd = window.innerHeight + window.scrollY > document.documentElement.scrollHeight - 40;
    dock.classList.toggle("hide", nearEnd && window.scrollY > 200);
  };
  window.addEventListener("scroll", onScroll, { passive: true }); onScroll();
})();
</script>
</body>
</html>
