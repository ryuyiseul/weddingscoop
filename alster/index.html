<style>

      '<svg class="line-ico" viewBox="0 0 100 100" fill="none" stroke="#0d3d17" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><rect x="18" y="12" width="70" height="46" rx="3"/><circle cx="34" cy="28" r="6"/><path d="M26 50v-8a8 8 0 0 1 16 0"/><path d="M40 38l22-12"/><circle cx="22" cy="70" r="6"/><circle cx="50" cy="70" r="6"/><circle cx="78" cy="70" r="6"/><path d="M12 90v-4a10 10 0 0 1 20 0v4z"/><path d="M40 90v-4a10 10 0 0 1 20 0v4z"/><path d="M68 90v-4a10 10 0 0 1 20 0v4z"/></svg>',
    sns:
      '<svg class="line-ico" viewBox="0 0 100 100" fill="none" stroke="#0d3d17" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="50" cy="50" r="30" stroke-dasharray="4 7"/><path d="M38 44h6l14-9v30l-14-9h-6z"/><path d="M44 56l3 9"/><path d="M63 45a7 7 0 0 1 0 10"/><circle cx="22" cy="22" r="11" fill="#f6f7f9"/><path d="M17 23c3 2 8 1 10-4-2 1-3 0-3 0" stroke-width="3"/><circle cx="78" cy="22" r="11" fill="#f6f7f9"/><path d="M80 16h-2a3 3 0 0 0-3 3v10M73 22h6" stroke-width="3"/><circle cx="22" cy="78" r="11" fill="#f6f7f9"/><path d="M19 73v10l8-5z" stroke-width="3"/><circle cx="78" cy="78" r="11" fill="#f6f7f9"/><rect x="72" y="72" width="12" height="12" rx="3" stroke-width="3"/><circle cx="78" cy="78" r="2.5" stroke-width="3"/></svg>'
  };
  var art = function (b) { return b.image ? '<img src="' + esc(b.image) + '" alt="" loading="lazy">' : (ARTS[b.art] || ''); };

  var RENDER = {
    link: function (b) {
      return '<a class="block link"' + href(b.url) + '><span class="thumb" style="position:relative">' + art(b) + '</span><span class="t">' + esc(b.title) + '</span></a>';
    },
    banner: function (b) {
      return '<a class="block"' + href(b.url) + '><div class="banner-art' + (b.art === 'archive' ? ' tall' : '') + '">' + art(b) + '</div><div class="caption">' + esc(b.title) + '</div></a>';
    },
    grid: function (b) {
      return '<div class="block grid">' + b.items.map(function (it, i) {
        var a = GRID_ART[it.art];
        return '<a' + href(it.url) + '><span class="sq">' + (typeof a === 'function' ? a(it, i) : a || '') + '</span><span class="lbl">' + esc(it.title) + '</span></a>';
      }).join('') + '</div>';
    },
    product: function (b) {
      return '<a class="block product"' + href(b.url) + '><span class="cover" style="position:relative">' + art(b) + '</span><span class="info">' +
        '<span class="pt">' + esc(b.title) + '</span>' +
        '<span class="price" style="display:block">' + (b.discount ? '<em>' + esc(b.discount) + '</em>' : '') + '<b>' + esc(b.price) + '</b></span>' +
        (b.badge ? '<span class="tag">' + esc(b.badge) + '</span>' : '') + '</span></a>';
    },
    divider: function () { return '<div class="divider" role="separator"></div>'; }
  };

  var mailto = 'mailto:' + S.email + '?subject=' + encodeURIComponent('[협업 제안] ');
  var html =
    '<header class="profile">' + avatar() +
    '<h1>' + esc(S.name) + ' ' + esc(S.handle) + '</h1>' +
    '<p class="bio">' + S.bio.map(esc).join('<br>') + '<br>협업문의 📩 <a href="mailto:' + esc(S.email) + '">' + esc(S.email) + '</a></p>' +
    '<a class="collab" href="' + esc(mailto) + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>협업 제안</a>' +
    '</header>' +
    S.blocks.map(function (b) { return RENDER[b.type] ? RENDER[b.type](b) : ''; }).join('') +
    '<footer>© ' + new Date().getFullYear() + ' ' + esc(S.name) + '</footer>';
  document.getElementById('app').innerHTML = html;

  document.getElementById('mini').innerHTML = avatar() + esc(S.name);
  document.getElementById('mail').href = mailto;

  var fl = document.getElementById('floating');
  if (S.floating) {
    fl.textContent = S.floating.title;
    if (S.floating.url) { fl.href = S.floating.url; fl.target = '_blank'; fl.rel = 'noopener'; }
    else { fl.href = '#'; fl.setAttribute('data-soon', ''); }
  } else fl.remove();

  var toastEl = document.getElementById('toast'), tid;
  var toast = function (msg) {
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(tid); tid = setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
  };
  document.addEventListener('click', function (e) {
    var a = e.target.closest('[data-soon]');
    if (a) { e.preventDefault(); toast('곧 열릴 예정이에요 🙌'); }
  });

  document.getElementById('share').addEventListener('click', function () {
    var data = { title: document.title, url: location.href };
    var copy = function () {
      try {
        navigator.clipboard.writeText(location.href).then(function () { toast('링크를 복사했어요'); }, function () { toast(location.href); });
      } catch (err) { toast(location.href); }
    };
    if (navigator.share) { navigator.share(data).catch(function (err) { if (!err || err.name !== 'AbortError') copy(); }); return; }
    copy();
  });

  var bar = document.getElementById('topbar');
  var onScroll = function () { bar.classList.toggle('scrolled', window.scrollY > 170); };
  window.addEventListener('scroll', onScroll, { passive: true }); onScroll();
})();
</script>
</body>
</html>
